# Function-by-function matching ledger for the main DOL.
# Status values: matched (byte-identical, verified), equivalent (logic
# confirmed correct via hand-tracing + compile, not yet byte-exact,
# remaining gaps fully understood/categorized), in_progress (compiles,
# real objdiff match % against ground truth, call sequence/logic verified
# correct, but remaining gaps not yet fully chased down/categorized one by
# one the way `equivalent` requires), not_started.
#
# This is the source of truth `tools/scripts/progress_report.py` reads to
# compute the honest completion percentage in README.md - update this file
# whenever a function's status changes, the README number is derived, not
# hand-maintained.

