project_name = "RE4Native"

# Extracted GameCube disc (sys/ + files/) - the debug build this whole
# project is built around, and the one our 7467 recovered function symbols
# line up with.
input_game_dir = "C:/Users/Admin/Downloads/RE4 PROJECT/re4-gc-decomp/orig/debug_disc1"

output_dir = "export"
runtime_source_dir = "C:/Users/Admin/Downloads/RE4 PROJECT/NWiiRecomp/nWiiRuntime"

# Recovered symbol table (Ghidra + the debug disc's own .sym files, exported
# from config/RE4DBG/symbols.txt). Seeds the analyzer's function discovery
# instead of relying purely on recursive branch analysis.
symbols_csv = "re4_symbols.csv"

# re4_symbols.csv gives some symbols a `re4_` prefix. Most avoid clashes with
# libc/CRT or with functions nWiiRuntime defines natively. The OS heap API
# (OSInitAlloc, OSCreateHeap, OSAllocFromHeap, OSFreeToHeap) is renamed for a
# different reason: auto-HLE binding is by name, and nWiiRuntime's HLE
# allocator keeps its heap state natively while RE4 also runs the SDK's own
# OSDestroyHeap/OSCheckHeap against the guest HeapArray. Mixed, the two broke
# MemDestroyHeap and every allocation after it (NULL buffers, low memory
# overwritten). The recompiled SDK allocator is plain CPU code and matches
# hardware exactly, so the whole heap runs recompiled.

# RE4's main.dol is ~2.5 MB of code; split the generated C++ across many
# translation units or the compiler will choke on one enormous file.
split_output = true
instructions_per_file = 20000

# Functions nWiiRuntime already implements natively but that aren't in the
# recompiler's conservative auto-bind whitelist. Without these the recompiled
# PowerPC body and the runtime's native version both get emitted and the link
# fails with "multiple definition". Addresses come from our own symbol table.
#[hle_hooks]
#"80083b94" = "VIInit"
#"8008450c" = "VIConfigure"
#"80084eb0" = "VISetBlack"
#"80084fd0" = "VIGetNextField"
#"8009dfac" = "GXLoadTexMtxImm"
#"801d6014" = "OSSetCurrentHeap"
#"801d6100" = "OSDestroyHeap"
#"801d6124" = "OSCheckHeap"
